spring:
  application:
    name: job-board-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobboard}
    username: ${DB_USERNAME:jobboard}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Actuator (sadece health endpoint'i açıktır)
  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: never

server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET}}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  security:
    login-max-failed-attempts: 5
    login-lockout-minutes: 15
    email-verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:true}
      token-ttl-minutes: 1440
    password-reset-token-ttl-minutes: 30
    rate-limit:
      login-limit: 20
      login-window-seconds: 300
      register-limit: 10
      register-window-seconds: 3600
      refresh-limit: 60
      refresh-window-seconds: 300
      resend-verification-limit: 5
      resend-verification-window-seconds: 3600
      cv-upload-limit: 20
      cv-upload-window-seconds: 3600
  web:
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:job-board-cvs}
    presigned-url-expiration: 600
    max-files-per-user: 20
    max-total-size-bytes: 104857600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  mail:
    enabled: ${MAIL_ENABLED:true}
